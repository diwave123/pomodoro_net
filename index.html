<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注番茄钟</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header>
            <h1>🍅 专注番茄钟</h1>
            <p class="subtitle">保持专注，提升效率</p>

            <!-- 连续打卡 & 每日目标 -->
            <div class="streak-goal-bar">
                <div class="streak-info" id="streak-info">
                    <span class="flame-icon">🔥</span>
                    <span>连续 <strong id="streak-days">0</strong> 天</span>
                </div>
                <div class="goal-progress" id="goal-progress">
                    <span class="goal-text">今日目标: <strong id="goal-current">0</strong>/<strong id="goal-target">8</strong></span>
                    <div class="goal-bar">
                        <div class="goal-fill" id="goal-fill"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Tab 导航 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="timer">⏱️ 番茄钟</button>
            <button class="tab-btn" data-tab="todo">📝 待办</button>
            <button class="tab-btn" data-tab="stats">📊 统计</button>
        </nav>

        <!-- 番茄钟面板 -->
        <div class="tab-content active" id="tab-timer">
            <div class="timer-container">
                <!-- 模式选择 -->
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="pomodoro" data-time="25">专注</button>
                    <button class="mode-btn" data-mode="shortBreak" data-time="5">短休息</button>
                    <button class="mode-btn" data-mode="longBreak" data-time="15">长休息</button>
                </div>

                <!-- 番茄钟显示 -->
                <div class="timer-circle">
                    <svg viewBox="0 0 260 260" class="timer-svg">
                        <circle cx="130" cy="130" r="120" class="timer-bg"></circle>
                        <circle cx="130" cy="130" r="120" class="timer-progress" id="progress"></circle>
                    </svg>
                    <div class="timer-display">
                        <span id="time-display">25:00</span>
                        <span class="timer-label" id="timer-label">专注时间</span>
                        <span class="current-task-label" id="current-task-label"></span>
                    </div>
                </div>

                <!-- 控制按钮 -->
                <div class="controls">
                    <button class="control-btn secondary" id="reset-btn" title="重置">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                    </button>
                    <button class="control-btn primary" id="start-btn">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="play-icon">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="pause-icon" style="display: none;">
                            <rect x="6" y="4" width="4" height="16"/>
                            <rect x="14" y="4" width="4" height="16"/>
                        </svg>
                    </button>
                    <button class="control-btn secondary" id="skip-btn" title="跳过">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5,4 15,12 5,20"/>
                            <line x1="19" y1="5" x2="19" y2="19"/>
                        </svg>
                    </button>
                </div>

                <!-- 白噪音控制 -->
                <div class="ambient-section">
                    <details>
                        <summary>🎵 背景音</summary>
                        <div class="ambient-grid" id="ambient-grid">
                            <button class="ambient-btn" data-sound="rain">
                                <span class="ambient-icon">🌧️</span>
                                <span class="ambient-name">雨声</span>
                            </button>
                            <button class="ambient-btn" data-sound="forest">
                                <span class="ambient-icon">🌲</span>
                                <span class="ambient-name">森林</span>
                            </button>
                            <button class="ambient-btn" data-sound="ocean">
                                <span class="ambient-icon">🌊</span>
                                <span class="ambient-name">海浪</span>
                            </button>
                            <button class="ambient-btn" data-sound="cafe">
                                <span class="ambient-icon">☕</span>
                                <span class="ambient-name">咖啡馆</span>
                            </button>
                            <button class="ambient-btn" data-sound="fire">
                                <span class="ambient-icon">🔥</span>
                                <span class="ambient-name">篝火</span>
                            </button>
                            <button class="ambient-btn" data-sound="wind">
                                <span class="ambient-icon">💨</span>
                                <span class="ambient-name">风声</span>
                            </button>
                        </div>
                        <div class="volume-control">
                            <label>🔊 音量</label>
                            <input type="range" id="volume-slider" min="0" max="100" value="50">
                        </div>
                    </details>
                </div>

                <!-- 设置区域 -->
                <div class="settings-section">
                    <details>
                        <summary>⚙️ 设置</summary>
                        <div class="settings-content">
                            <div class="setting-item">
                                <label>专注时长（分钟）</label>
                                <input type="number" id="pomodoro-time" value="25" min="1" max="60">
                            </div>
                            <div class="setting-item">
                                <label>短休息（分钟）</label>
                                <input type="number" id="short-break-time" value="5" min="1" max="30">
                            </div>
                            <div class="setting-item">
                                <label>长休息（分钟）</label>
                                <input type="number" id="long-break-time" value="15" min="1" max="60">
                            </div>
                            <div class="setting-item">
                                <label>每日目标（番茄数）</label>
                                <input type="number" id="daily-goal" value="8" min="1" max="30">
                            </div>
                            <div class="setting-item setting-toggle">
                                <label>自动连续模式</label>
                                <label class="switch">
                                    <input type="checkbox" id="auto-continue">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </details>
                </div>

                <!-- 统计信息 -->
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-number" id="completed-pomodoros">0</span>
                        <span class="stat-label">已完成番茄</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="total-focus-time">0分钟</span>
                        <span class="stat-label">今日专注时长</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="tasks-completed-today">0</span>
                        <span class="stat-label">完成任务数</span>
                    </div>
                </div>

                <!-- 番茄列表 -->
                <div class="pomodoro-list" id="pomodoro-list"></div>
            </div>
        </div>

        <!-- 待办清单面板 -->
        <div class="tab-content" id="tab-todo">
            <div class="todo-container">
                <div class="todo-input-section">
                    <form id="todo-form" class="todo-form">
                        <input type="text" id="todo-input" placeholder="添加新任务..." autocomplete="off">
                        <button type="submit" class="add-todo-btn">添加</button>
                    </form>
                </div>

                <!-- 任务过滤 -->
                <div class="todo-filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="active">进行中</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>

                <!-- 任务列表 -->
                <ul class="todo-list" id="todo-list">
                    <!-- 动态生成任务项 -->
                </ul>

                <div class="todo-empty" id="todo-empty">
                    <p>暂无任务，添加一个开始吧 🎯</p>
                </div>

                <!-- 底部操作 -->
                <div class="todo-footer" id="todo-footer" style="display: none;">
                    <span id="todo-count"></span>
                    <button class="clear-completed-btn" id="clear-completed">清除已完成</button>
                </div>
            </div>
        </div>

        <!-- 统计面板 -->
        <div class="tab-content" id="tab-stats">
            <div class="stats-container">
                <!-- 时间范围切换 -->
                <div class="stats-range">
                    <button class="range-btn active" data-range="today">今天</button>
                    <button class="range-btn" data-range="week">本周</button>
                    <button class="range-btn" data-range="month">本月</button>
                </div>

                <!-- 总览卡片 -->
                <div class="stats-overview">
                    <div class="overview-card">
                        <span class="overview-value" id="overview-total-pomos">0</span>
                        <span class="overview-label">总番茄数</span>
                    </div>
                    <div class="overview-card">
                        <span class="overview-value" id="overview-total-hours">0h</span>
                        <span class="overview-label">总专注时长</span>
                    </div>
                    <div class="overview-card">
                        <span class="overview-value" id="overview-total-tasks">0</span>
                        <span class="overview-label">完成任务</span>
                    </div>
                    <div class="overview-card">
                        <span class="overview-value" id="overview-best-streak">0</span>
                        <span class="overview-label">最长连续</span>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="chart-section">
                    <h3 class="section-title">专注趋势</h3>
                    <div class="chart-wrapper">
                        <canvas id="stats-chart" width="360" height="200"></canvas>
                    </div>
                </div>

                <!-- 热力图区域 -->
                <div class="heatmap-section">
                    <h3 class="section-title">活跃热力图</h3>
                    <div class="heatmap-wrapper" id="heatmap-wrapper">
                        <!-- 动态生成 -->
                    </div>
                    <div class="heatmap-legend">
                        <span>少</span>
                        <div class="legend-cells">
                            <span class="legend-cell level-0"></span>
                            <span class="legend-cell level-1"></span>
                            <span class="legend-cell level-2"></span>
                            <span class="legend-cell level-3"></span>
                            <span class="legend-cell level-4"></span>
                        </div>
                        <span>多</span>
                    </div>
                </div>

                <!-- 详细日志 -->
                <div class="history-section">
                    <h3 class="section-title">历史记录</h3>
                    <div class="history-list" id="history-list">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>💡 每完成4个番茄后建议休息更长时间</p>
        </footer>
    </div>

    <!-- 音效提示 -->
    <audio id="alarm-sound" preload="auto">

    </audio>

    <script src="script.js"></script>
</body>
</html>
