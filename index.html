<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注番茄钟</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- 顶部固定导航 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <h1>🍅 番茄钟</h1>
        </div>
        <div class="top-bar-right">
            <span class="status-chip streak-chip" id="streak-info">🔥 0天</span>
            <span class="status-chip goal-chip" id="goal-info">0/8</span>

            <!-- 右上角浮动工具按钮 -->
            <button class="fab-btn" id="btn-sound" title="背景音">🎵</button>
            <button class="fab-btn" id="btn-settings" title="设置">⚙️</button>
            <button class="fab-btn" id="btn-theme" title="切换主题">🌙</button>
        </div>
    </header>

    <!-- 浮动面板：背景音 -->
    <div class="float-panel" id="panel-sound">
        <div class="fp-header"><h3>🎵 背景音</h3><button class="fp-close">&times;</button></div>
        <div class="sound-grid">
            <button class="sound-btn" data-sound="rain"><span>🌧️</span>雨声</button>
            <button class="sound-btn" data-sound="forest"><span>🌲</span>森林</button>
            <button class="sound-btn" data-sound="ocean"><span>🌊</span>海浪</button>
            <button class="sound-btn" data-sound="cafe"><span>☕</span>咖啡馆</button>
            <button class="sound-btn" data-sound="fire"><span>🔥</span>篝火</button>
            <button class="sound-btn" data-sound="wind"><span>💨</span>风声</button>
        </div>
        <div class="volume-row">
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="50">
        </div>
        <div class="sound-stop-row">
            <button class="stop-sound-btn" id="btn-stop-sound">⏹ 停止播放</button>
        </div>
    </div>

    <!-- 浮动面板：设置 -->
    <div class="float-panel" id="panel-settings">
        <div class="fp-header"><h3>⚙️ 设置</h3><button class="fp-close">&times;</button></div>
        <div class="settings-grid fp-body">
            <label>专注 <input type="number" id="pomodoro-time" value="25" min="1" max="60"> 分</label>
            <label>短休 <input type="number" id="short-break-time" value="5" min="1" max="30"> 分</label>
            <label>长休 <input type="number" id="long-break-time" value="15" min="1" max="60"> 分</label>
            <label>目标 <input type="number" id="daily-goal" value="8" min="1" max="30"> 个</label>
            <label class="toggle-row">
                自动连续
                <input type="checkbox" id="auto-continue">
            </label>
        </div>
    </div>

    <main class="main-content">
        <!-- ===== Tab1: 番茄钟 ===== -->
        <section class="tab-panel active" id="panel-timer">

            <!-- 核心计时区（Hero） -->
            <div class="hero-card">
                <!-- 模式选择 - 紧凑行内 -->
                <div class="mode-pills">
                    <button class="mode-pill active" data-mode="pomodoro">专注</button>
                    <button class="mode-pill" data-mode="shortBreak">短休</button>
                    <button class="mode-pill" data-mode="longBreak">长休</button>
                </div>

                <!-- 计时器圆环 -->
                <div class="timer-ring">
                    <svg viewBox="0 0 260 260" class="ring-svg">
                        <circle cx="130" cy="130" r="118" class="ring-bg"></circle>
                        <circle cx="130" cy="130" r="118" class="ring-progress" id="progress"></circle>
                    </svg>
                    <div class="ring-center">
                        <div class="time-text" id="time-display">25:00</div>
                        <div class="mode-label" id="timer-label">专注中</div>
                        <div class="task-hint" id="current-task-label"></div>
                    </div>
                </div>

                <!-- 控制按钮 -->
                <div class="btn-row">
                    <button class="ctrl-btn icon-only" id="reset-btn" title="重置 (R)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <button class="ctrl-btn main-btn" id="start-btn" title="开始/暂停 (空格)">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" id="play-icon"><polygon points="6,4 20,12 6,20"/></svg>
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" id="pause-icon" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="ctrl-btn icon-only" id="skip-btn" title="跳过 (S)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                    </button>
                </div>

                <!-- 今日统计 - 单行紧凑 -->
                <div class="mini-stats">
                    <div class="mini-stat">
                        <strong id="completed-pomodoros">0</strong>
                        <span>番茄</span>
                    </div>
                    <div class="mini-stat-divider"></div>
                    <div class="mini-stat">
                        <strong id="total-focus-time">0m</strong>
                        <span>专注</span>
                    </div>
                    <div class="mini-stat-divider"></div>
                    <div class="mini-stat">
                        <strong id="tasks-completed-today">0</strong>
                        <span>任务</span>
                    </div>
                </div>

                <!-- 已完成番茄图标行 -->
                <div class="pomodoro-icons" id="pomodoro-list"></div>
            </div>
        </section>

        <!-- ===== Tab2: 待办清单 ===== -->
        <section class="tab-panel" id="panel-todo">
            <div class="todo-card">
                <!-- Page Header -->
                <div class="todo-page-header">
                    <h2>待办事项</h2>
                    <span class="task-count-badge" id="todo-count-badge">0 项任务</span>
                </div>

                <form id="todo-form" class="todo-input-row">
                    <input type="text" id="todo-input" placeholder="输入任务后按回车添加..." autocomplete="off">
                    <button type="submit" class="add-btn">+</button>
                </form>

                <div class="filter-row">
                    <button class="filt-btn active" data-filter="all">全部</button>
                    <button class="filt-btn" data-filter="active">进行中</button>
                    <button class="filt-btn" data-filter="completed">已完成</button>
                </div>

                <ul class="task-list" id="todo-list"></ul>

                <div class="empty-state" id="todo-empty">
                    <p>暂无任务<br><small>添加一个开始专注吧 🎯</small></p>
                </div>

                <div class="list-footer" id="todo-footer" style="display:none;">
                    <span id="todo-count"></span>
                    <button class="clean-btn" id="clear-completed">清除已完成</button>
                </div>
            </div>
        </section>

        <!-- ===== Tab3: 统计 ===== -->
        <section class="tab-panel" id="panel-stats">
            <div class="stats-page">
                <!-- 时间范围 -->
                <div class="range-tabs">
                    <button class="r-tab active" data-range="today">今天</button>
                    <button class="r-tab" data-range="week">本周</button>
                    <button class="r-tab" data-range="month">本月</button>
                </div>

                <!-- 一行数字总览 -->
                <div class="stat-row">
                    <div class="stat-cell"><strong id="overview-total-pomos">0</strong><span>番茄数</span></div>
                    <div class="stat-divider"></div>
                    <div class="stat-cell"><strong id="overview-total-hours">0h</strong><span>专注时长</span></div>
                    <div class="stat-divider"></div>
                    <div class="stat-cell"><strong id="overview-total-tasks">0</strong><span>完成任务</span></div>
                </div>

                <!-- 图表区（紧凑） -->
                <div class="chart-area" id="chart-area">
                    <canvas id="stats-chart"></canvas>
                </div>

                <!-- 折叠：热力图 -->
                <details class="stats-detail">
                    <summary>📈 活跃热力图</summary>
                    <div class="detail-body">
                        <div class="heatmap-sm" id="heatmap-wrapper"></div>
                        <div class="heat-legend-sm"><span>少</span><div class="heat-dots"><i></i><i></i><i></i><i></i><i></i></div><span>多</span></div>
                    </div>
                </details>

                <!-- 折叠：历史记录 -->
                <details class="stats-detail">
                    <summary>📋 历史记录</summary>
                    <div class="detail-body history-scroll" id="history-list">
                        <p class="empty-hist">暂无历史记录</p>
                    </div>
                </details>

                <!-- 连续天数（底部小字） -->
                <div class="streak-footer"><span id="overview-best-streak">0</span> 天连续打卡</div>
            </div>
        </section>
    </main>

    <!-- 底部 Tab 导航（移动端风格） -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-panel="timer">
            <span class="nav-icon">🍅</span>
            <span class="nav-label">计时</span>
        </button>
        <button class="nav-btn" data-panel="todo">
            <span class="nav-icon">📋</span>
            <span class="nav-label">待办</span>
        </button>
        <button class="nav-btn" data-panel="stats">
            <span class="nav-icon">📊</span>
            <span class="nav-label">统计</span>
        </button>
    </nav>

    </audio>

    <script src="script.js"></script>
</body>
</html>
